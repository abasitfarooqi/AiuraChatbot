<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neguinho Motors Chatbot Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .chatbot-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 600px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            z-index: 10000;
            border: 1px solid #e0e0e0;
        }
        
        .chatbot-widget.minimized {
            height: 60px;
            width: 300px;
        }
        
        .chatbot-widget.minimized .chat-messages,
        .chatbot-widget.minimized .chat-input-container {
            display: none;
        }
        
        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .chat-header h3 {
            margin: 0;
            font-size: 1rem;
        }
        
        .minimize-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 0.5rem;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f9f9f9;
        }
        
        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            word-wrap: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background: #3498db;
            color: white;
        }
        
        .message.assistant {
            align-self: flex-start;
            background: white;
            color: #2c3e50;
            border: 1px solid #e0e0e0;
        }
        
        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 0.5rem;
            background: white;
        }
        
        .chat-input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            font-size: 0.9rem;
        }
        
        .send-button {
            padding: 0.75rem 1.5rem;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .send-button:hover {
            background: #2980b9;
        }
        
        .send-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .suggestions {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(52, 152, 219, 0.1);
            border-left: 3px solid #3498db;
        }
        
        .suggestion-btn {
            display: block;
            width: 100%;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: white;
            border: 1px solid #3498db;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
            color: #3498db;
        }
        
        .suggestion-btn:hover {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div id="chatbotWidget" class="chatbot-widget">
        <div class="chat-header" onclick="toggleWidget()">
            <h3>Neguinho Motors Chatbot</h3>
            <button class="minimize-btn" onclick="event.stopPropagation(); toggleWidget();">−</button>
        </div>
        
        <div class="chat-messages" id="messagesContainer">
            <div class="message assistant">
                Hello! I'm the Neguinho Motors chatbot. I can help you with bike rentals, sales, finance, servicing, and more. How can I assist you today?
            </div>
        </div>
        
        <div class="chat-input-container">
            <input 
                type="text" 
                class="chat-input" 
                id="messageInput" 
                placeholder="Type your message..."
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >
            <button class="send-button" id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>
    
    <script>
        // Configuration - Set your ngrok URL here
        const CHATBOT_API_URL = window.CHATBOT_API_URL || 'http://localhost:8000/api/v1';
        
        let isMinimized = false;
        let userId = localStorage.getItem('chatbot_widget_userId');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chatbot_widget_userId', userId);
        }
        
        let currentChatId = localStorage.getItem('chatbot_widget_currentChatId');
        
        function toggleWidget() {
            const widget = document.getElementById('chatbotWidget');
            isMinimized = !isMinimized;
            widget.classList.toggle('minimized', isMinimized);
        }
        
        function generateChatId() {
            return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            if (!currentChatId) {
                currentChatId = generateChatId();
            }
            
            addMessage('user', message);
            input.value = '';
            
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            sendButton.innerHTML = '<div class="loading"></div>';
            
            try {
                const response = await fetch(`${CHATBOT_API_URL}/chat/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        chat_id: currentChatId,
                        message: message
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.chat_id) {
                    currentChatId = data.chat_id;
                    localStorage.setItem('chatbot_widget_currentChatId', currentChatId);
                }
                
                addMessage('assistant', data.response);
                
                if (data.suggestions && data.suggestions.length > 0) {
                    addSuggestions(data.suggestions);
                }
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', `Sorry, I encountered an error: ${error.message}`);
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Send';
            }
        }
        
        function addMessage(role, content) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const formattedContent = content.replace(/\n/g, '<br>');
            messageDiv.innerHTML = formattedContent;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
        
        function addSuggestions(suggestions) {
            const container = document.getElementById('messagesContainer');
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'suggestions';
            
            const title = document.createElement('div');
            title.style.fontSize = '0.85rem';
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '0.5rem';
            title.style.color = '#3498db';
            title.textContent = 'You might also ask:';
            suggestionsDiv.appendChild(title);
            
            suggestions.forEach(suggestion => {
                const suggestionBtn = document.createElement('button');
                suggestionBtn.className = 'suggestion-btn';
                suggestionBtn.textContent = suggestion;
                suggestionBtn.onclick = () => {
                    document.getElementById('messageInput').value = suggestion;
                    sendMessage();
                };
                suggestionsDiv.appendChild(suggestionBtn);
            });
            
            container.appendChild(suggestionsDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
